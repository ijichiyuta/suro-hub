# 本番は Cloudflare Pages（smasuro-lab.com）へ配信。
#   ローカル全再生成が必要な時は `npm run deploy`（build-data→build-calc→build→wrangler pages deploy）。
#   このCIは push 時に「コミット済みの src/data・public/calc」から build して Pages へデプロイする。
#   ⚠ 有効化には GitHub リポの Secrets に CLOUDFLARE_API_TOKEN（Cloudflare Pages:Edit 権限）が必要。
#      未設定の間は deploy をスキップ（run は成功のまま）＝github.io を壊さない。
#   （旧: GitHub Pages 配信は basePath 空へ移行したため廃止）
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Check Cloudflare token
        id: cf
        run: echo "has_token=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=smasuro-lab --branch=main
