<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>スマスマ期待値ラボ｜移転しました</title>
<script>
// 旧GitHub Pages版(ijichiyuta.github.io/suro-hub)は廃止。新ドメイン smasuro-lab.com へ転送する。
//   ・古いServiceWorker/キャッシュを解除して確実に新サイトへ抜ける（ホーム画面のPWA対策）。
//   ・パスとクエリ/ハッシュを保持して転送（/suro-hub 接頭辞は除去）。
(function () {
  var target = "https://smasuro-lab.com";
  try {
    if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { try { r.unregister(); } catch (e) {} }); });
    }
  } catch (e) {}
  try {
    if (window.caches && caches.keys) { caches.keys().then(function (ks) { ks.forEach(function (k) { try { caches.delete(k); } catch (e) {} }); }); }
  } catch (e) {}
  var path = location.pathname.replace(/^\/suro-hub/, "");
  location.replace(target + path + location.search + location.hash);
})();
</script>
<meta http-equiv="refresh" content="1;url=https://smasuro-lab.com/">
<style>
  body { font-family: -apple-system, system-ui, "Hiragino Sans", sans-serif; max-width: 520px; margin: 16vh auto; padding: 0 24px; color: #0e1526; text-align: center; line-height: 1.8; }
  h1 { font-size: 20px; letter-spacing: -0.02em; }
  p { color: #667085; font-size: 14px; }
  a { display: inline-block; margin-top: 8px; color: #fff; background: #1f5eff; text-decoration: none; font-weight: 700; padding: 12px 22px; border-radius: 8px; }
</style>
</head>
<body>
<h1>新しいサイトへ移動します</h1>
<p>スマスマ期待値ラボは <b>smasuro-lab.com</b> へ移転しました。<br>自動で移動しない場合は下のボタンをタップしてください。</p>
<p><a href="https://smasuro-lab.com/">smasuro-lab.com を開く</a></p>
</body>
</html>
