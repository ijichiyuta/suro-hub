project_id = "rhlzapshrggtozqzkran"

# Stripe決済のEdge Functions。
#  - create-checkout / customer-portal … ユーザーのJWTで呼ぶが、CORSプリフライト(OPTIONS)を
#    ゲートで弾かせないため verify_jwt=false にし、関数内で supabase.auth.getUser により本人確認する。
#  - stripe-webhook … StripeからSupabaseのJWT無しで叩かれるので verify_jwt=false 必須(署名で検証)。
[functions.create-checkout]
verify_jwt = false

[functions.customer-portal]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# 退会/アカウント削除。ユーザーJWTで呼び、関数内で getUser 本人確認→サブスク解約→データ削除→Auth削除。
[functions.delete-account]
verify_jwt = false

# 友だち紹介。ユーザーJWTで呼び、関数内で getUser 本人確認→コード発行/紹介者紐付け。
[functions.referral]
verify_jwt = false
